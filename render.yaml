services:
  # Backend API server (Docker)
  - type: web
    name: pos-offline-api
    env: docker
    plan: starter
    branch: main
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: PARTNER_ACCESS_TOKEN
        sync: false
      - key: TRANSAK_API_BASE_URL
        value: https://api-gateway.transak.com/api/v2
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pos-postgres
          property: connectionString

  # Postgres database for Transak reconciliation
  - type: pserv
    name: pos-postgres
    plan: starter
    postgresMajorVersion: 15
    region: frankfurt

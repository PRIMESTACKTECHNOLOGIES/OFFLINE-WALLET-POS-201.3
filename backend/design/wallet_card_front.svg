<?xml version="1.0" encoding="UTF-8"?>
<svg width="856" height="540" viewBox="0 0 856 540" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="g-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" rx="24" ry="24" width="856" height="540" fill="#0F172A" />

  <!-- Soft gradient band -->
  <rect x="0" y="170" width="856" height="120" fill="url(#g-grad)" opacity="0.12" filter="url(#soft)" rx="12"/>

  <!-- Top-left wordmark -->
  <g transform="translate(36,48)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#FFFFFF">PrimeStack</text>
    <text x="0" y="28" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#E6EEF8">Wallet Card</text>
  </g>

  <!-- Center title -->
  <g transform="translate(80,240)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="20" fill="#FFFFFF" letter-spacing="4">INTERNAL WALLET CARD</text>
  </g>

  <!-- Bottom-left WALLET ID -->
  <g transform="translate(48,420)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#A8C3E8">WALLET ID</text>
    <text x="0" y="22" id="wallet-id" font-family="Inter, Consolas, 'Courier New', monospace" font-weight="700" font-size="20" fill="#FFFFFF">{{WALLET_ID}}</text>
  </g>

  <!-- Bottom-right cardholder and validity -->
  <g transform="translate(560,400)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#A8C3E8">CARDHOLDER</text>
    <text x="0" y="22" id="cardholder" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">{{CARDHOLDER}}</text>
    <text x="0" y="46" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#A8C3E8">VALID THRU</text>
    <text x="66" y="46" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">12/29</text>
  </g>

  <!-- NFC indicator (simple icon) -->
  <g transform="translate(780,40)" fill="#FFFFFF" opacity="0.9">
    <circle cx="0" cy="0" r="10"/>
    <path d="M18,-6 C14,0 14,0 18,6" stroke="#0F172A" stroke-width="2" fill="none" transform="translate(-8,0)"/>
  </g>

  <!-- Decorative subtle watermark on front (low opacity) -->
  <g transform="translate(300,70)" opacity="0.06">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="120" fill="#FFFFFF">PrimeStack</text>
  </g>

  <!-- Notes: replace {{WALLET_ID}} and {{CARDHOLDER}} programmatically -->
</svg>
